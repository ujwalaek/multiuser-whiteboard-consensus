syntax = "proto3";
package wb;
option go_package = "wb/pb";

service Raft {
  rpc RequestVote(VoteReq) returns (VoteResp);
  rpc AppendEntries(AppendReq) returns (AppendResp);
}
message LogEntry { uint64 term = 1; bytes op = 2; }
message VoteReq {
  uint64 term = 1; string candidate = 2; uint64 last_index = 3; uint64 last_term = 4;
  string sender = 5; bytes mac = 6;
}
message VoteResp { uint64 term = 1; bool granted = 2; }
message AppendReq {
  uint64 term = 1; string leader = 2; uint64 prev_index = 3; uint64 prev_term = 4;
  repeated LogEntry entries = 5; uint64 leader_commit = 6; string sender = 7; bytes mac = 8;
}
message AppendResp { uint64 term = 1; bool success = 2; uint64 match_index = 3; }

service Pbft {
  rpc PrePrepare(PrePrepareMsg) returns (Ack);
  rpc Prepare(PhaseMsg) returns (Ack);
  rpc Commit(PhaseMsg) returns (Ack);
}
message PrePrepareMsg {
  uint64 view = 1; uint64 seq = 2; bytes digest = 3; bytes op = 4; string sender = 5; bytes mac = 6;
}
message PhaseMsg { uint64 view = 1; uint64 seq = 2; bytes digest = 3; string sender = 4; bytes mac = 5; }
message Ack {}