<!doctype html>
<meta charset="utf-8">
<title>Replicated Whiteboard</title>
<style>
  body { font-family: sans-serif; margin: 8px }
  #bar { display: flex; gap: 10px; align-items: center; margin-bottom: 6px; flex-wrap: wrap }
  svg { border: 1px solid #888; width: 100%; height: 70vh; background: #fff; touch-action: none }
  button.on { background: #cde }
  #warn { color: #b00; font-weight: bold }
</style>
<div id="bar">
  <b id="who"></b>
  <button data-t="draw" class="on">Draw</button>
  <button data-t="erase">Erase</button>
  <button data-t="move">Move</button>
  <input type="color" id="col" value="#0000ff">
  <span id="info"></span>
  <span id="warn"></span>
</div>
<svg id="board"></svg>
<script src="board.js"></script>
<script>
const R = Number(location.port) - 8000;           // replica this page is served from
const base = i => `http://${location.hostname}:${8000 + i}`;
// This client's Ed25519 key; its id is the public key, so replicas can check that a
// request really comes from the client it names (PBFT accepts only signed requests).
const hex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
const me = crypto.subtle.generateKey({ name: 'Ed25519' }, false, ['sign', 'verify'])
  .then(async k => ({ key: k.privateKey, id: hex(await crypto.subtle.exportKey('raw', k.publicKey)) }));
const svg = document.getElementById('board');
const board = new Board(), els = new Map();
let clock = 0, tool = 'draw', quorum, verifiedBy = '';

document.querySelectorAll('button[data-t]').forEach(b => b.onclick = () => {
  tool = b.dataset.t;
  document.querySelectorAll('button[data-t]').forEach(x => x.classList.toggle('on', x === b));
});

// ---- receive committed blocks (the only way the canvas changes) ----
// Raft trusts the replica this page came from. PBFT listens to every replica and
// draws a block only once f+1 of them sent the same block hash.
fetch(base(R) + '/admin/status').then(r => r.json()).then(st => {
  const pbft = st.proto === 'pbft';
  quorum = new Quorum(pbft ? st.f + 1 : 1);
  quorum.n = st.n;
  const from = pbft ? [...Array(st.n).keys()] : [R];
  verifiedBy = pbft ? `needs ${st.f + 1} of ${st.n} replicas to agree` : `trusts r${R}`;
  document.getElementById('who').textContent = `replica r${R} (${st.proto})`;
  from.forEach(i => {
    const ws = new WebSocket(`ws://${location.hostname}:${8000 + i}/ws`);
    ws.onmessage = ev => { quorum.receive(i, JSON.parse(ev.data)).forEach(render); showSuspects(); };
  });
});

function render(b) {
  b.ops.forEach((op, k) => {
    clock = Math.max(clock, op.lamport || 0) + 1;          // Lamport receive rule
    if (b.dup && b.dup[k]) return;                         // retried request: drawn once
    const ch = board.apply(op);
    if (ch.type === 'add') {
      const el = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
      el.setAttribute('points', op.shape.points.map(p => p.join(',')).join(' '));
      el.setAttribute('stroke', op.shape.color);
      el.setAttribute('stroke-width', 3);
      el.setAttribute('fill', 'none');
      el.dataset.id = op.id;
      svg.appendChild(el); els.set(op.id, el);
    } else if (ch.type === 'remove') {
      els.get(ch.id)?.remove(); els.delete(ch.id);
    } else if (ch.type === 'move') {
      const s = board.shapes.get(ch.id);
      els.get(ch.id)?.setAttribute('transform', `translate(${s.x},${s.y})`);
    }
  });
  document.getElementById('info').textContent =
    `block=${b.index}  lamport=${clock}  ledger-head=${b.hash.slice(0, 12)}  (${verifiedBy})`;
}

// A liar's block usually arrives after the honest ones were released, so the warning is
// refreshed on every message, not only when a block is drawn.
function showSuspects() {
  document.getElementById('warn').textContent = quorum.suspects.size
    ? 'disagreeing replicas ignored: ' + [...quorum.suspects].map(i => 'r' + i).join(', ') : '';
}

// ---- send ops (follows leader/primary redirects) ----
// If the primary does not take the op, it goes to every replica: backups watch it and
// replace the primary (PBFT view change) if it is not executed in time.
async function submit(op) {
  const { key, id } = await me;
  op.client = id; op.lamport = ++clock;                   // Lamport send rule
  const signed = JSON.stringify(op);                      // sign exactly the bytes sent, then append sig
  const sig = hex(await crypto.subtle.sign('Ed25519', key, new TextEncoder().encode(signed)));
  const body = signed.slice(0, -1) + `,"sig":"${sig}"}`;
  let url = base(R);
  for (let i = 0; i < 3; i++) {
    try {
      const j = await (await fetch(url + '/submit', { method: 'POST', body })).json();
      if (j.ok) return j;
      if (j.redirect) { url = j.redirect; continue; }
    } catch (e) { /* unreachable: fall through to the broadcast */ }
    break;
  }
  const n = quorum ? quorum.n : 4;
  await Promise.all([...Array(n).keys()].map(i =>
    fetch(base(i) + '/submit', { method: 'POST', body }).catch(() => null)));
}

// ---- pointer handling ----
const pt = e => { const r = svg.getBoundingClientRect(); return [Math.round(e.clientX - r.left), Math.round(e.clientY - r.top)]; };
const newId = p => p + Math.random().toString(36).slice(2);
let pts = null, preview = null, dragTarget = null, dragStart = null;
svg.onpointerdown = e => {
  const id = e.target.dataset?.id;
  if (tool === 'draw') {
    pts = [pt(e)];
    preview = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
    preview.setAttribute('stroke', '#bbb'); preview.setAttribute('fill', 'none');  // tentative until committed
    svg.appendChild(preview);
  } else if (tool === 'erase' && id) {
    submit({ kind: 'erase', id: newId('o'), target: id });
  } else if (tool === 'move' && id) {
    dragTarget = id; dragStart = pt(e);
  }
};
svg.onpointermove = e => {
  if (pts) { pts.push(pt(e)); preview.setAttribute('points', pts.map(p => p.join(',')).join(' ')); }
};
svg.onpointerup = e => {
  if (pts) {                                              // one op per stroke, not per point
    preview.remove();
    if (pts.length > 1) submit({ kind: 'draw', id: newId('s'),
      shape: { type: 'polyline', points: pts, color: document.getElementById('col').value } });
    pts = null;
  } else if (dragTarget) {                                // moves carry the absolute target position
    const p = pt(e), s = board.shapes.get(dragTarget);
    submit({ kind: 'move', id: newId('o'), target: dragTarget,
      x: s.x + p[0] - dragStart[0], y: s.y + p[1] - dragStart[1] });
    dragTarget = null;
  }
};
</script>
